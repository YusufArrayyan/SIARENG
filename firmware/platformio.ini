; Pemantau Potensi Longsor Lereng - ESP32 + MPU6050 + sensor tanah + sensor hujan
; Platform dikunci ke 6.9.0 (Arduino-ESP32 core 2.0.17) agar API LEDC/Wire stabil.

[env:esp32doit-devkit-v1]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
monitor_echo = yes          ; perintah kalibrasi yang diketik terlihat di Serial Monitor
lib_deps =
    bblanchon/ArduinoJson@^7.0.4

[env:wokwi]
extends = env:esp32doit-devkit-v1
build_flags =
    -DKIRIM_WIFI=1
    -DWOKWI_SIMULATOR=1

[env:esp32doit-devkit-v1-wifi]
extends = env:esp32doit-devkit-v1
build_flags = -DKIRIM_WIFI=1

; ---------------------------------------------------------------------
; ALAT ASLI (komponen yang dibeli: sensor asli + buzzer aktif TMB12A05)
; Tidak perlu mengubah config.h. Kalibrasi lewat Serial Monitor (ketik "info").
;   pio run -e alat -t upload        -> data lewat kabel USB
;   pio run -e alat-wifi -t upload   -> data lewat WiFi (isi include/secrets.h dulu)
; ---------------------------------------------------------------------
[env:alat]
extends = env:esp32doit-devkit-v1
build_flags =
    -DSIMULASI=0
    -DBUZZER_PASIF=0

[env:alat-wifi]
extends = env:esp32doit-devkit-v1
build_flags =
    -DSIMULASI=0
    -DBUZZER_PASIF=0
    -DKIRIM_WIFI=1
