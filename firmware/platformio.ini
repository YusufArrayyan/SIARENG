; Pemantau Potensi Longsor Lereng - ESP32 + MPU6050 + sensor tanah + sensor hujan
; Platform dikunci ke 6.9.0 (Arduino-ESP32 core 2.0.17) agar API LEDC/Wire stabil.

[env:esp32doit-devkit-v1]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
