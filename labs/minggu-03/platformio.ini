; Praktikum Minggu 3 (Lab-2): I2C, OLED SSD1306, FreeRTOS, Deep Sleep
; Dua program dalam satu proyek:
;   pio run -e esp32doit-devkit-v1   -> program utama (src/main.cpp)
;   pio run -e scanner               -> I2C Scanner (src/scanner.cpp)
[common]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

[env:esp32doit-devkit-v1]
extends = common
build_src_filter = +<*> -<scanner.cpp>
lib_deps =
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.0.4

[env:scanner]
extends = common
build_src_filter = -<*> +<scanner.cpp>
